<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>

<body>
<script>
(async function launch() {
    const BASE_URL =
        "https://cdn.jsdelivr.net/gh/vaultgamesdevelopment/thevault.github.io@latest/";

    try {
        // Fetch the single-file HTML
        const response = await fetch(
            BASE_URL + "singlefile.html?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}: ${response.statusText}`
            );
        }

        const html = await response.text();

        // Parse it first
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        // Make relative URLs resolve against the CDN
        let base = doc.querySelector("base");

        if (!base) {
            base = doc.createElement("base");
            doc.head.prepend(base);
        }

        base.href = BASE_URL;

        // Copy the document title
        document.title = doc.title || "The Vault";

        // Replace the current document contents
        document.documentElement.replaceWith(
            document.importNode(doc.documentElement, true)
        );

        /*
         * Scripts inserted by importNode/innerHTML don't execute.
         * Recreate them so the fetched application can initialize.
         */
        const scripts = [
            ...document.querySelectorAll("script")
        ];

        for (const oldScript of scripts) {
            const newScript = document.createElement("script");

            // Copy all attributes
            for (const attr of oldScript.attributes) {
                newScript.setAttribute(
                    attr.name,
                    attr.value
                );
            }

            if (oldScript.src) {
                // Resolve relative script URLs against BASE_URL
                newScript.src = new URL(
                    oldScript.getAttribute("src"),
                    BASE_URL
                ).href;
            } else {
                newScript.textContent =
                    oldScript.textContent;
            }

            oldScript.replaceWith(newScript);
        }

    } catch (error) {
        console.error("Failed to load site:", error);

        document.body.innerHTML = `
            <div style="
                font-family:system-ui;
                padding:40px;
                text-align:center;
            ">
                <h2>Unable to load site</h2>
                <p>${error.message}</p>
            </div>
        `;
    }
})();
</script>
</body>
</html>
