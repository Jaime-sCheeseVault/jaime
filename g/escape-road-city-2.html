<!DOCTYPE html>
<!-- Ultimate Game Stash file -->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Road</title>

  <style>
    html,
    body {
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    #gameContainer {
      position: absolute;
    }

    #gameContainer canvas {
      position: absolute;
    }
  </style>
</head>

<body>

  <script id="gmsoft-jssdk" src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/escaperoad2city/gmsoftsdk_v5.js"></script>

  <div id="gameContainer" style="display: none;">
    <canvas id="unity-canvas"></canvas>
  </div>

  <div
    id="loadingBar"
    style="
      color: white;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial;
    "
  >
    loading... <span id="pct">0%</span>
  </div>

  <script>
    function firebaseLogEvent(event_name) {
      console.log("firebaseLogEvent (stubbed):", event_name);
    }

    function firebaseLogEventParameter(event_name, event_param) {
      console.log(
        "firebaseLogEventParameter (stubbed):",
        event_name,
        event_param
      );
    }

    function firebaseSetUserProperties(props) {
      console.log("firebaseSetUserProperties (stubbed):", props);
    }
  </script>

  <!-- File merger configuration -->
  <script>
    window.fileMergerConfig = {
      files: [
        {
          name: "escape-road-city-2-v25022604.data.unityweb",
          parts: 2
        }
      ],

      basePath:
        "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/escaperoad2city/Build/",

      debug: true
    };
  </script>

  <!-- File merger -->
  <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/merge.js"></script>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var container = document.getElementById("gameContainer");
    var loadingBar = document.getElementById("loadingBar");
    var pct = document.getElementById("pct");

    /*
     * Use absolute URLs instead of <base href>.
     * This prevents GitHub Pages/custom-domain URL resolution
     * from interfering with Unity.
     */

    var assetBase =
      "https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/escaperoad2city/";

    var buildUrl = assetBase + "Build";

    var config = {
      dataUrl:
        buildUrl +
        "/escape-road-city-2-v25022604.data.unityweb",

      frameworkUrl:
        buildUrl +
        "/escape-road-city-2-v25022604.framework.js.unityweb",

      codeUrl:
        buildUrl +
        "/escape-road-city-2-v25022604.wasm.unityweb",

      streamingAssetsUrl:
        assetBase + "StreamingAssets",

      companyName: "azgames.io",
      productName: "Tung Sahur Horror",
      productVersion: "25051505",

      pubId: "",
      gameId: "tung-sahur-horror",

      enableMoreGame: "yes",
      enablePromotion: true,
      eventLog: false
    };

    function onResize() {
      var w = window.innerWidth;
      var h = window.innerHeight;

      var r = 540 / 960;

      if (w * r > h) {
        w = Math.ceil(h / r);
      }

      h = Math.floor(w * r);

      container.style.width = canvas.style.width = w + "px";
      container.style.height = canvas.style.height = h + "px";

      container.style.top =
        Math.floor((window.innerHeight - h) / 2) + "px";

      container.style.left =
        Math.floor((window.innerWidth - w) / 2) + "px";
    }

    onResize();
    window.addEventListener("resize", onResize);

    /*
     * Load the Unity loader from the CDN explicitly.
     */

    var script = document.createElement("script");

    script.src =
      buildUrl +
      "/escape-road-city-2-v25022604.loader.js";

    script.onload = function () {
      console.log("Unity loader loaded:", script.src);
      console.log("Unity config:", config);

      try {
        createUnityInstance(
          canvas,
          config,
          function (progress) {
            var percent = Math.round(progress * 100);

            pct.innerText = percent + "%";
          }
        )
          .then(function (instance) {
            console.log("Unity instance created successfully.");

            window.unityInstance = instance;

            setTimeout(function () {
              loadingBar.style.display = "none";
              container.style.display = "block";

              window.focus();
            }, 2000);
          })
          .catch(function (msg) {
            console.error("Unity failed to initialize:", msg);

            loadingBar.innerText =
              "Failed to load game. Check the browser console.";

            alert(msg);
          });
      } catch (error) {
        console.error(
          "createUnityInstance threw an error:",
          error
        );

        loadingBar.innerText =
          "Failed to initialize Unity.";

        alert(error);
      }
    };

    script.onerror = function () {
      console.error(
        "Failed to load Unity loader:",
        script.src
      );

      loadingBar.innerText =
        "Failed to load Unity loader.";
    };

    document.body.appendChild(script);
  </script>

</body>
</html>
